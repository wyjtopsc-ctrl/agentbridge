<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
<rect width="1000" height="380" rx="12" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="999" height="379" rx="12" fill="none" stroke="#30363d"/>
<circle cx="28" cy="28" r="6" fill="#ff5f56"/><circle cx="50" cy="28" r="6" fill="#ffbd2e"/><circle cx="72" cy="28" r="6" fill="#27c93f"/>
<text x="36" y="58" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">agentbridge evidence verify — example output (hashes_only mode, content not reviewed)</text>
<text x="36" y="96" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">$ agentbridge evidence verify --pack ./pack --trust ./trust.json</text>
<text x="36" y="120" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15"></text>
<text x="36" y="144" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">integrity   pass    chain, files, delivery bindings</text>
<text x="36" y="168" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">identity    pass    trusted keys + key timeline</text>
<text x="36" y="192" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">acceptance  pass    v2 accepted; v1 superseded</text>
<text x="36" y="216" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">coverage    pass    recorded events match declared scope</text>
<text x="36" y="240" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">anchoring   pass    covers seq 8; checkpoint matches</text>
<text x="36" y="264" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">content     not_executed   hashes_only: file content not reviewed</text>
<text x="36" y="288" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15"></text>
<text x="36" y="312" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">exit_code: 2</text>
<text x="36" y="336" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">disclosure: verifying delivery digests and signing records; file content was not reviewed.</text>
</svg>
