name: Bug report
description: Report a reproducible defect in agentbridge
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste private keys or customer data.
        For security issues, use the private advisory channel described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, versions, minimal pack or ledger excerpt.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.9.3 (641a53a)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [ledger/verify, identity/keys, evidence pack, transport/MCP, docs, other]
